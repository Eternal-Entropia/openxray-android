plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openxray'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "org.openxray"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.6.02"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DBUILD_SHARED_LIBS=ON",
                          "-DXRAY_USE_LUAJIT=ON"
                cppFlags "-std=c++17 -frtti -fexceptions"
            }
        }
    }

    signingConfigs {
        release {
            // Defaults to the well-known debug key so a release build can be
            // installed over an existing debug install without uninstalling.
            // Override for a real release key, e.g.
            //   ./gradlew assembleRelease -POXRAY_KEYSTORE=/path/key.jks \
            //       -POXRAY_KEYSTORE_PASS=... -POXRAY_KEY_ALIAS=... -POXRAY_KEY_PASS=...
            def storePath = project.findProperty("OXRAY_KEYSTORE")
                    ?: "${System.getProperty('user.home')}/.android/debug.keystore"
            storeFile file(storePath)
            storePassword project.findProperty("OXRAY_KEYSTORE_PASS") ?: "android"
            keyAlias project.findProperty("OXRAY_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword project.findProperty("OXRAY_KEY_PASS") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            externalNativeBuild {
                cmake {
                    // The NDK toolchain already compiles Release with -O3 and
                    // -flto=thin, but it does not add -flto to the link line, so
                    // no LTO was ever performed. Keep 16k page alignment and
                    // pass -flto through to the linker to make LTO real.
                    arguments "-DCMAKE_BUILD_TYPE=Release",
                              "-DCMAKE_SHARED_LINKER_FLAGS=-flto=thin",
                              "-DCMAKE_EXE_LINKER_FLAGS=-flto=thin"
                }
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // res/ ships inside the APK, split per game: res/soc/* for
            // Shadow of Chernobyl, res/cop/* for Clear Sky / CoP.
            // OpenXRayActivity auto-extracts the matching folder into
            // <game>/<mode>/ on launch.
            assets.srcDirs = ['../../res']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
